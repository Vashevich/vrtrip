name: Автотест VRtrip
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.47.0 trimesh numpy
      - run: python -m playwright install --with-deps chromium
      - run: python tests/make_models.py --no-heavy
      - run: (python -m http.server 8766 &) && sleep 2
      - run: python -u tests/smoke.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/shots/
